events {
    worker_connections 1024;
}

http {
    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Upstream server pool with sticky session configuration (ip_hash)
    upstream websocket_backend {
        ip_hash; # Sticky sessions to retain active WebSocket connection state per client IP
        server app:3000 max_fails=3 fail_timeout=10s;
        server app_replica:3000 max_fails=3 fail_timeout=10s backup;
    }

    server {
        listen 80;
        server_name localhost;

        # Route standard HTTP and WebSocket traffic
        location / {
            proxy_pass http://websocket_backend;

            # HTTP & Proxy Headers
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket Header Support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # WebSocket Timeouts
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # Healthcheck endpoint
        location /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'OK';
        }
    }
}
